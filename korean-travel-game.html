<title>韓語旅行單字挑戰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one boarding-pass card per question; tabs choose the game, chips choose the vocab section */
:root{
  --bg:#eef1f5; --paper:#ffffff; --ink:#18233f; --muted:#5d6782; --line:#d6dbe6;
  --accent:#1f7a6d; --accent-soft:#dcefeb; --bad:#c8402f; --bad-soft:#f8e1dc; --gold:#d79a21;
  --f-display:"Black Han Sans","Noto Sans KR",sans-serif;
  --f-body:"Noto Sans TC","Noto Sans KR",system-ui,sans-serif;
  --f-ko:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1424; --paper:#19213a; --ink:#e8ecf6; --muted:#9aa4c0; --line:#2c3656;
  --accent:#4cbfac; --accent-soft:#183a3a; --bad:#f07a66; --bad-soft:#3d2224; --gold:#f0bb4f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1424; --paper:#19213a; --ink:#e8ecf6; --muted:#9aa4c0; --line:#2c3656;
  --accent:#4cbfac; --accent-soft:#183a3a; --bad:#f07a66; --bad-soft:#3d2224; --gold:#f0bb4f; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:16px 40px;display:flex;flex-direction:column;gap:14px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
header .eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
h1{font-family:var(--f-display);font-weight:400;font-size:30px;margin:2px 0 0;line-height:1.1;text-wrap:balance}
.score{font-variant-numeric:tabular-nums;text-align:right;font-size:13px;color:var(--muted)}
.score b{display:block;font-size:22px;color:var(--accent)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{border:0;background:none;color:var(--muted);font:500 14px var(--f-body);padding:9px 4px;border-radius:9px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:13px var(--f-body);padding:5px 11px;border-radius:999px;cursor:pointer}
.chips button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.chips[hidden]{display:none!important}
.ticket{background:var(--paper);border:1px solid var(--line);border-radius:14px;position:relative;overflow:hidden}
.stub{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:2px dashed var(--line);font-size:12px;color:var(--muted);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.stub .gate{color:var(--accent);font-weight:700}
.progress{height:3px;background:var(--line)}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.body{padding:20px 16px 18px;display:flex;flex-direction:column;gap:16px}
.prompt-label{font-size:12px;color:var(--muted);letter-spacing:.06em}
.big{font-family:var(--f-ko);font-weight:700;font-size:34px;line-height:1.2;word-break:keep-all;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.big.zh{font-family:var(--f-body);font-size:28px}
.sentence{font-family:var(--f-ko);font-size:21px;line-height:1.7;word-break:keep-all}
.blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--accent);text-align:center;color:var(--accent);font-weight:700}
.trans{color:var(--muted);font-size:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:13px 10px;font:500 16px var(--f-ko);cursor:pointer;text-align:center;min-width:0;word-break:keep-all}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.opt.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.say{border:1px solid var(--line);background:var(--bg);color:var(--accent);border-radius:999px;width:44px;height:44px;font-size:20px;cursor:pointer;flex:none;display:inline-grid;place-items:center;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.say:active{transform:scale(.92);background:var(--accent-soft)}
.diag{white-space:pre-line;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px}
.testbtn{border:1px solid var(--line);background:var(--paper);color:var(--ink);font:500 13px var(--f-body);padding:8px 12px;border-radius:999px;cursor:pointer}
.feedback{border-radius:10px;padding:10px 12px;font-size:14px}
.feedback.ok{background:var(--accent-soft);color:var(--accent)}
.feedback.no{background:var(--bad-soft);color:var(--bad)}
.feedback .ko{font-family:var(--f-ko);font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;background:var(--ink);color:var(--paper);font:700 15px var(--f-body);padding:12px 18px;border-radius:10px;cursor:pointer;flex:1}
.btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
input.spell{width:100%;box-sizing:border-box;font:500 22px var(--f-ko);padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input.spell:focus{outline:none;border-color:var(--accent)}
.hint{font-size:13px;color:var(--muted)}
.card{min-height:220px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;text-align:center;cursor:pointer;border:1.5px dashed var(--line);border-radius:12px;padding:20px;background:var(--bg)}
.card .cat{font-size:12px;color:var(--gold);letter-spacing:.08em}
.end{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:stretch}
.stamp{font-family:var(--f-display);font-size:56px;color:var(--accent);line-height:1}
.miss{list-style:none;padding:0;margin:0;text-align:left;display:flex;flex-direction:column;gap:6px}
.miss li{display:flex;justify-content:space-between;gap:12px;padding:8px 12px;background:var(--bg);border-radius:8px}
.miss .ko{font-family:var(--f-ko);font-weight:700}
.miss .zh{color:var(--muted);text-align:right}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
footer{font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:380px){.big{font-size:28px}.opts{grid-template-columns:1fr}}
</style>

<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">고려 3 · 여행 단어</div>
      <h1>旅行單字挑戰</h1>
    </div>
    <div class="score"><b id="scoreNum">0</b>本回答對</div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-mode="mc" aria-selected="true" id="tab-mc">選擇題</button>
    <button role="tab" data-mode="fill" aria-selected="false" id="tab-fill">例句填空</button>
    <button role="tab" data-mode="spell" aria-selected="false" id="tab-spell">拼寫</button>
    <button role="tab" data-mode="cards" aria-selected="false" id="tab-cards">單字卡</button>
  </nav>

  <div class="row" style="align-items:center"><button type="button" class="testbtn" id="testBtn" onclick="testSound()">🔊 測試聲音</button></div>

    <div class="body" id="stage"></div>
  </section>

  <footer>點 🔊 可以聽發音（依裝置的語音而定）</footer>
</div>

<script>
const V = {
 "地名":[["강릉","江陵"],["전주","全州"],["부산","釜山"],["춘천","春川"],["보령","保寧"],["제주도","濟州島"],["서울","首爾"],["경주","慶州"]],
 "旅行種類":[["국내 여행","國內旅遊"],["해외여행","出國旅遊"],["자유 여행","自助旅遊"],["패키지여행","套裝旅遊、跟團旅遊"],["가족 여행","家庭旅遊"],["신혼여행","蜜月旅行"],["수학여행","校外教學"],["졸업 여행","畢業旅行"],["엠티(MT)","團隊訓練（旅遊）"]],
 "旅行準備":[["일정","行程"],["세우다","建立・訂定（行程）"],["잡다","訂定"],["당일치기","一日遊"],["1박 2일","兩天一夜"],["숙소","住宿"],["교통편","交通方式"],["알아보다","打聽 / 查找"],["찾아보다","打聽 / 查找"],["정하다","決定"],["예약하다","預約"],["항공권","機票"],["기차표","火車票"],["입장권","入場券"],["예매하다","訂購（票）"],["끊다","買（票）"],["여권","護照"],["비자","簽證"],["신청하다","申請"],["발급 받다","收領（核發）"],["환전하다","換錢"],["여행자 보험을 들다","投保旅遊保險"]],
 "旅行地特點":[["볼거리가 많다","可觀賞的東西很多"],["먹을거리가 많다","可吃的東西很多"],["즐길 거리가 많다","可玩的東西很多"],["축제가 있다","有慶典"],["맛집이 많다","美食店很多"],["전통문화를 체험할 수 있다","可以體驗傳統文化"]],
 "聽力":[["연말","年底"],["데","地方"],["따라다니다","跟隨"],["계획을 짜다","制定計畫・排行程"]],
 "其他":[["아직","還 / 還沒"],["호텔","飯店"],["게스트하우스","青年旅館 / 民宿"],["검색하다","搜尋"],["어떡하지?","怎麼辦？"],["깜박하다","忘記"],["생선회","生魚片"],["해물탕","海鮮鍋"],["자유 시간을 갖다","有自由時間"],["평소","平常"],["남는 시간","剩下的時間"],["둘러보다","逛、參觀"],["취소하다","取消"],["닭갈비","春川辣炒雞排"],["유명하다","有名 / 出名"],["성수기","旺季"],["비수기","淡季"],["예약이 다 차다","訂滿了"],["아무리","再怎麼"],["비밀번호","密碼"],["기억이 안 나다","想不起來"],["멀리","很遠・遠遠"],["살이 안 찌다","吃不胖"],["한옥 체험","韓屋體驗"]],
 "文化":[["프리마켓","市集"],["파주","坡州"],["DMZ","非軍事區"],["판문점","板門店"],["임진각","臨津閣"],["디자인","設計"],["패션쇼","時裝秀"],["창덕궁","昌德宮"],["야간","夜間"],["달빛","月光"],["기행","紀行"],["함께","一起"],["두물머리","兩水頭"]]
};
const S = [
 ["이번 ___에 가족 여행을 가려고 해요.","這次年底打算去家庭旅遊。","연말",["비수기","성수기","야간"]],
 ["여행 가기 전에 꼭 여권과 ___를 준비하세요.","出發前一定要準備護照和簽證。","비자",["입장권","비밀번호","달빛"]],
 ["호텔 ___이 다 차서 게스트하우스를 예약했어요.","飯店訂滿了，所以訂了民宿。","예약",["일정","기억","환전"]],
 ["춘천에 가면 ___를 꼭 먹어 보세요.","去春川一定要吃吃看辣炒雞排。","닭갈비",["비자","판문점","기차표"]],
 ["부산은 바다가 가까워서 ___가 유명해요.","釜山離海很近，生魚片很有名。","생선회",["입장권","수학여행","달빛"]],
 ["공항에 가기 전에 은행에서 돈을 ___.","去機場前在銀行換了錢。","환전했어요",["세웠어요","둘러봤어요","잡았어요"]],
 ["서울에서 경주까지 ___로 다녀왔어요.","從首爾到慶州一日遊來回。","당일치기",["비밀번호","패션쇼","생선회"]],
 ["이번 여행은 ___ 일정이에요. 하룻밤만 자요.","這次是兩天一夜的行程，只住一晚。","1박 2일",["당일치기","비수기","연말"]],
 ["전주 한옥마을에서 전통문화를 ___할 수 있어요.","在全州韓屋村可以體驗傳統文化。","체험",["환전","발급","검색"]],
 ["제주도는 볼거리도 많고 ___도 많아요.","濟州島可看的很多，可吃的也很多。","먹을거리",["비밀번호","여권","입장권"]],
 ["가을은 여행 ___라서 사람이 많아요.","秋天是旅遊旺季，人很多。","성수기",["비수기","기행","디자인"]],
 ["___에는 호텔 가격이 싸요.","淡季時飯店價格便宜。","비수기",["성수기","프리마켓","판문점"]],
 ["인터넷으로 맛집을 ___했어요.","在網路上搜尋了美食店。","검색",["환전","발급","신청"]],
 ["여권을 잃어버렸어요. ___?","護照弄丟了，怎麼辦？","어떡하지",["아무리","함께","멀리"]],
 ["호텔 방 ___가 기억이 안 나요.","想不起來飯店房間的密碼。","비밀번호",["입장권","1박 2일","달빛"]],
 ["가이드를 ___ 다니면서 구경했어요.","跟著導遊一邊走一邊參觀。","따라",["아직","아무리","비자"]],
 ["친구와 ___ 여행 계획을 짰어요.","和朋友一起排了旅行計畫。","함께",["아직","아무리","야간"]],
 ["밤에 남산에서 ___을 보며 산책했어요.","晚上在南山一邊看月光一邊散步。","달빛",["비자","생선회","기차표"]],
 ["___ 시간에 시장을 둘러봤어요.","利用剩下的時間逛了市場。","남는",["유명한","멀리","아직"]],
 ["학생 때 경주로 ___을 갔어요.","學生時代去慶州校外教學。","수학여행",["신혼여행","환전","비밀번호"]],
 ["DMZ와 ___은 파주에 있어요.","非軍事區和臨津閣在坡州。","임진각",["창덕궁","두물머리","강릉"]],
 ["아무리 먹어도 ___.","再怎麼吃都吃不胖。","살이 안 쪄요",["예약이 다 차요","기억이 안 나요","볼거리가 많아요"]],
 ["숙소 예약을 ___해서 돈을 돌려받았어요.","取消了住宿預約，拿回了錢。","취소",["검색","환전","체험"]],
 ["비행기 표는 인터넷으로 미리 ___했어요.","機票事先在網路上訂購了。","예매",["환전","체험","발급"]]
];

const ALL = Object.entries(V).flatMap(([c,l])=>l.map(([ko,zh])=>({ko,zh,cat:c})));
const $ = s=>document.querySelector(s);
const shuffle = a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s=>s.replace(/[\s?？()（）.]/g,"").toLowerCase();

let mode="mc", cat="全部", queue=[], idx=0, score=0, wrong=[], locked=false;

let koVoice=null;
function loadVoices(){try{const vs=speechSynthesis.getVoices();koVoice=vs.find(v=>/^ko/i.test(v.lang))||null}catch(e){}}
try{loadVoices();speechSynthesis.onvoiceschanged=loadVoices}catch(e){}
function toast(msg){let t=document.getElementById("toast");if(!t){t=document.createElement("div");t.id="toast";t.style.cssText="position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:528px;margin:0 auto;background:var(--ink);color:var(--paper);padding:12px 14px;border-radius:10px;font-size:14px;z-index:9";document.body.appendChild(t)}t.textContent=msg;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,4500)}
function speak(t){
  if(!("speechSynthesis" in window)||typeof SpeechSynthesisUtterance==="undefined"){toast("這個瀏覽器不支援語音播放，請改用 Safari 或 Chrome 開啟這個頁面。");return}
  try{
    loadVoices();
    const u=new SpeechSynthesisUtterance(t.replace(/\(.*?\)/g,"").replace(/\?/g,""));
    u.lang="ko-KR";u.rate=.85;u.volume=1;if(koVoice)u.voice=koVoice;
    let started=false;u.onstart=()=>started=true;
    u.onerror=e=>{if(e.error!=="interrupted"&&e.error!=="canceled")toast("語音播放失敗，請確認手機沒有開靜音，或改用 Safari / Chrome 開啟。")};
    if(speechSynthesis.speaking||speechSynthesis.pending)speechSynthesis.cancel();
    speechSynthesis.resume();
    speechSynthesis.speak(u);
    setTimeout(()=>{if(!started&&!speechSynthesis.speaking)toast(koVoice?"沒有播出聲音：請確認手機側邊的靜音開關已關閉、音量已調高。":"找不到韓語語音。iPhone 可到「設定 › 輔助使用 › 朗讀內容 › 聲音」下載韓文語音，或改用 Safari 開啟。")},1500);
  }catch(e){toast("語音播放失敗，請改用 Safari 或 Chrome 開啟。")}
}
const sayBtn = ko=>`<button type="button" class="say" aria-label="播放發音" data-say="${esc(ko)}">🔊</button>`;
document.addEventListener("click",e=>{const b=e.target.closest("[data-say]");if(!b)return;e.stopPropagation();e.preventDefault();speak(b.dataset.say,b)},true);
function testSound(){
  const out=document.getElementById("diag");
  let info=[];
  if(!("speechSynthesis" in window)){out.textContent="❌ 這個瀏覽器不支援語音。";out.hidden=false;return}
  let vs=[];try{vs=speechSynthesis.getVoices()}catch(e){}
  const ko=vs.filter(v=>/^ko/i.test(v.lang));
  info.push(`裝置語音共 ${vs.length} 個，韓文語音 ${ko.length} 個${ko.length?"（"+ko.map(v=>v.name).join("、")+"）":""}`);
  out.textContent=info.join("\n")+"\n正在播放「안녕하세요」…";out.hidden=false;
  try{
    const u=new SpeechSynthesisUtterance("안녕하세요");u.lang="ko-KR";if(ko[0])u.voice=ko[0];
    let st=false;
    u.onstart=()=>{st=true;out.textContent=info.join("\n")+"\n✅ 系統說正在播放。如果還是聽不到，是靜音開關或音量的問題。"};
    u.onerror=e=>{out.textContent=info.join("\n")+"\n❌ 播放錯誤："+e.error};
    if(speechSynthesis.speaking)speechSynthesis.cancel();
    speechSynthesis.speak(u);
    setTimeout(()=>{if(!st)out.textContent=info.join("\n")+"\n❌ 系統沒有開始播放。"+(ko.length?"":"請到「設定 › 輔助使用 › 朗讀內容 › 聲音 › 韓文」下載語音後重新整理。")},2000);
  }catch(e){out.textContent="❌ "+e.message}
}

function pool(){return cat==="全部"?ALL:ALL.filter(w=>w.cat===cat)}

function renderChips(){
  $("#chips").hidden = mode==="fill";
  $("#chips").innerHTML=["全部",...Object.keys(V)].map(c=>`<button class="${c===cat?"on":""}" data-cat="${c}">${c}</button>`).join("");
}
$("#chips").onclick=e=>{const c=e.target.dataset.cat;if(!c)return;cat=c;renderChips();start()};
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  mode=b.dataset.mode;document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected",x===b));renderChips();start()});

function start(list){
  idx=0;score=0;wrong=[];$("#scoreNum").textContent=0;
  if(mode==="fill") queue = list || shuffle(S).slice(0,10);
  else if(mode==="cards") queue = list || shuffle(pool());
  else queue = list || shuffle(pool()).slice(0,10);
  $("#stubLeft").textContent={mc:"選擇題 · 객관식",fill:"例句填空 · 빈칸",spell:"拼寫 · 쓰기",cards:"單字卡 · 카드"}[mode];
  show();
}
function setProgress(){$("#stubRight").textContent=`${Math.min(idx+1,queue.length)} / ${queue.length}`;$("#bar").style.width=(idx/queue.length*100)+"%"}

function show(){
  locked=false;
  if(idx>=queue.length && mode!=="cards") return finish();
  setProgress();
  ({mc:showMC,fill:showFill,spell:showSpell,cards:showCard})[mode]();
}

function distractors(w,key){
  let p=ALL.filter(x=>x.cat===w.cat && x.zh!==w.zh && x.ko!==w.ko);
  if(p.length<3) p=ALL.filter(x=>x.zh!==w.zh && x.ko!==w.ko);
  return shuffle(p).slice(0,3).map(x=>x[key]);
}
function showMC(){
  const w=queue[idx], toZh=Math.random()<.5;
  const ans= toZh?w.zh:w.ko, opts=shuffle([ans,...distractors(w,toZh?"zh":"ko")]);
  $("#stage").innerHTML=`
    <div class="prompt-label">${toZh?"這個韓文是什麼意思？":"這個中文用韓文怎麼說？"}　<span style="color:var(--gold)">${w.cat}</span></div>
    <div class="big ${toZh?"":"zh"}">${esc(toZh?w.ko:w.zh)} ${toZh?sayBtn(w.ko):""}</div>
    <div class="opts">${opts.map(o=>`<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>
    <div id="fb"></div>`;
  $("#stage").querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(b,b.dataset.v===ans,w,ans));
}
function showFill(){
  const [s,zh,ans,d]=queue[idx], opts=shuffle([ans,...d]);
  $("#stage").innerHTML=`
    <div class="prompt-label">選出最適合放進空格的單字</div>
    <div class="sentence">${esc(s).replace("___",'<span class="blank" id="blank">?</span>')}</div>
    <div class="trans">${esc(zh)}</div>
    <div class="opts">${opts.map(o=>`<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>
    <div id="fb"></div>`;
  $("#stage").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    $("#blank").textContent=ans;
    answer(b,b.dataset.v===ans,{ko:s.replace("___",ans),zh},ans,true)});
}
function showSpell(){
  const w=queue[idx];
  $("#stage").innerHTML=`
    <div class="prompt-label">用韓文寫出來　<span style="color:var(--gold)">${w.cat}</span></div>
    <div class="big zh">${esc(w.zh)}</div>
    <form id="sf" class="row" style="flex-direction:column">
      <input class="spell" id="spellInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="한국어로 입력…">
      <div class="hint">提示：第一個字是「${esc([...w.ko][0])}」，共 ${w.ko.replace(/\s/g,"").length} 個字（不算空格）</div>
      <div class="row"><button class="btn" type="submit">確認</button><button class="btn ghost" type="button" id="giveUp">看答案</button></div>
    </form>
    <div id="fb"></div>`;
  const inp=$("#spellInput"); setTimeout(()=>inp.focus(),50);
  $("#sf").onsubmit=e=>{e.preventDefault();if(locked||!inp.value.trim())return;answer(null,norm(inp.value)===norm(w.ko),w,w.ko)};
  $("#giveUp").onclick=()=>{if(!locked)answer(null,false,w,w.ko)};
}
function answer(btn,ok,w,ans,isSentence){
  if(locked)return;locked=true;
  if(ok){score++;$("#scoreNum").textContent=score}else wrong.push(mode==="fill"?{ko:ans,zh:w.zh}:w);
  $("#stage").querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.dataset.v===ans)b.classList.add("ok")});
  if(btn&&!ok)btn.classList.add("no");
  const inp=$("#spellInput");if(inp)inp.disabled=true;
  $("#fb").innerHTML=`<div class="feedback ${ok?"ok":"no"}">${ok?"答對了！":"答案是"} <span class="ko">${esc(isSentence?w.ko:(mode==="mc"?w.ko+" ＝ "+w.zh:w.ko))}</span> ${sayBtn(isSentence?w.ko:w.ko)}</div>
    <div class="row" style="margin-top:10px"><button class="btn" id="next">${idx+1<queue.length?"下一題 →":"看結果"}</button></div>`;
  $("#next").onclick=()=>{idx++;show()};
  $("#next").focus();
  if(ok)speak(isSentence?w.ko:w.ko);
}
function showCard(){
  const w=queue[idx]; let flipped=false;
  $("#stage").innerHTML=`
    <div class="card" id="card" role="button" tabindex="0" aria-label="翻面">
      <div class="cat">${w.cat}</div>
      <div class="big" id="face" style="justify-content:center">${esc(w.ko)} ${sayBtn(w.ko)}</div>
      <div class="hint" id="cardHint">點一下看中文</div>
    </div>
    <div class="row"><button class="btn ghost" id="prev">← 上一張</button><button class="btn" id="nextC">下一張 →</button></div>`;
  const flip=()=>{flipped=!flipped;$("#face").className="big"+(flipped?" zh":"");
    $("#face").innerHTML=flipped?esc(w.zh):esc(w.ko)+" "+sayBtn(w.ko);$("#cardHint").textContent=flipped?"再點一下回到韓文":"點一下看中文"};
  $("#card").onclick=flip;$("#card").onkeydown=e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();flip()}};
  $("#prev").onclick=()=>{idx=(idx-1+queue.length)%queue.length;show()};
  $("#nextC").onclick=()=>{idx=(idx+1)%queue.length;show()};
}
function finish(){
  $("#bar").style.width="100%";$("#stubRight").textContent="完成";
  const pct=score/queue.length, msg=pct===1?"全對！準備出發 ✈︎":pct>=.7?"很不錯，再複習幾個就好":"多練幾次就會記住";
  $("#stage").innerHTML=`<div class="end">
    <div class="stamp">${score}<span style="font-size:24px;color:var(--muted)"> / ${queue.length}</span></div>
    <div>${msg}</div>
    ${wrong.length?`<div class="prompt-label" style="text-align:left">要再複習的單字</div>
      <ul class="miss">${wrong.map(w=>`<li><span class="ko">${esc(w.ko)}</span><span class="zh">${esc(w.zh)}</span></li>`).join("")}</ul>`:""}
    <div class="row">
      ${wrong.length&&mode!=="fill"?`<button class="btn" id="retryWrong">只練錯的</button>`:""}
      <button class="btn ${wrong.length&&mode!=="fill"?"ghost":""}" id="again">再玩一次</button>
    </div></div>`;
  $("#again").onclick=()=>start();
  const rw=$("#retryWrong");if(rw)rw.onclick=()=>start(shuffle(wrong));
}
document.addEventListener("keydown",e=>{
  if(mode==="mc"||mode==="fill"){const n=+e.key;if(n>=1&&n<=4&&!locked){const b=$("#stage").querySelectorAll(".opt")[n-1];b&&b.click()}}
});
renderChips();start();
</script>
