<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>龍舟賽線上集章 ‧ 9/19</title>
<style>
  :root{
    --navy:#0F3D5C; --navy-dark:#0A2C42; --teal:#0E7C7B; --red:#D9483A;
    --gold:#E3B23C; --cream:#F7F8FA; --card:#FFFFFF; --text:#1A2530; --muted:#5B6670;
    --line:#E3E7EB;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--cream);color:var(--text);}
  .app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--cream);position:relative;padding-bottom:78px;}
  header.topbar{background:linear-gradient(135deg,var(--navy-dark),var(--navy));color:#fff;padding:18px 20px 22px;position:relative;overflow:hidden;}
  header.topbar::after{content:"";position:absolute;right:-30px;top:-40px;width:150px;height:150px;border-radius:50%;background:var(--teal);opacity:.35;}
  header.topbar h1{margin:0;font-size:19px;font-weight:800;letter-spacing:.5px;position:relative;}
  header.topbar p{margin:4px 0 0;font-size:12.5px;color:#BFD3E3;position:relative;}
  .role-switch{position:absolute;top:16px;right:16px;font-size:11px;color:#BFD3E3;text-decoration:underline;cursor:pointer;z-index:2;}

  .screen{padding:16px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(15,61,92,.06);}
  .card h3{margin:0 0 8px;font-size:15px;color:var(--navy);}
  .muted{color:var(--muted);font-size:12.5px;}
  input[type=text],input[type=number],textarea,select{
    width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff;color:var(--text);
  }
  label{font-size:12.5px;color:var(--muted);display:block;margin:10px 0 4px;}
  button{cursor:pointer;border:none;border-radius:10px;font-weight:700;font-size:14.5px;padding:12px 16px;}
  .btn-primary{background:var(--red);color:#fff;width:100%;}
  .btn-primary:disabled{background:#D8B3AE;cursor:not-allowed;}
  .btn-outline{background:#fff;border:1.5px solid var(--navy);color:var(--navy);}
  .btn-ghost{background:var(--cream);color:var(--navy);}
  .tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:#fff;border-top:1px solid var(--line);display:flex;z-index:10;}
  .tabbar button{flex:1;background:none;border-radius:0;padding:10px 4px 8px;font-size:11px;color:var(--muted);font-weight:600;}
  .tabbar button.active{color:var(--red);}
  .tabbar .ic{font-size:19px;display:block;margin-bottom:2px;}

  .stamp-row{display:flex;gap:10px;margin:14px 0;}
  .stamp{flex:1;text-align:center;border-radius:12px;padding:14px 6px;border:2px dashed var(--line);}
  .stamp.done{border-style:solid;border-color:var(--teal);background:#EAF6F5;}
  .stamp .emoji{font-size:28px;display:block;margin-bottom:6px;}
  .stamp .label{font-size:12px;font-weight:700;color:var(--navy);}
  .stamp .state{font-size:10.5px;margin-top:3px;color:var(--muted);}
  .stamp.done .state{color:var(--teal);}

  .progress-track{height:8px;background:#E7ECF0;border-radius:6px;overflow:hidden;margin:8px 0 4px;}
  .progress-fill{height:100%;background:var(--red);border-radius:6px;transition:width .4s;}

  .coupon{background:linear-gradient(135deg,var(--navy),var(--navy-dark));color:#fff;border-radius:14px;padding:20px;text-align:center;position:relative;}
  .coupon .code{font-size:30px;letter-spacing:6px;font-weight:800;margin:8px 0;font-family:"Courier New",monospace;}
  .prize-card{background:linear-gradient(135deg,var(--red),#B8382C);color:#fff;border-radius:14px;padding:20px;text-align:center;}
  .prize-card .name{font-size:22px;font-weight:800;margin-top:6px;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;}
  th{color:var(--navy);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;}
  .qty-low{color:var(--red);font-weight:700;}

  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;}
  .pill.ok{background:#DFF3EF;color:var(--teal);}
  .pill.wait{background:#FBEAE8;color:var(--red);}

  .segmented{display:flex;background:var(--cream);border-radius:10px;padding:3px;gap:3px;}
  .segmented button{flex:1;background:transparent;color:var(--muted);padding:9px 4px;font-size:12.5px;border-radius:8px;}
  .segmented button.active{background:#fff;color:var(--navy);box-shadow:0 1px 4px rgba(0,0,0,.1);}

  .gate{display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;padding:20px;text-align:center;}
  .gate .icon{font-size:40px;margin-bottom:10px;}

  .empty{text-align:center;padding:30px 10px;color:var(--muted);font-size:13px;}

  canvas{width:100%;background:linear-gradient(180deg,#BEE3F0,#8FC7DF);border-radius:12px;display:block;}
  .row-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .row-item:last-child{border-bottom:none;}
  .badge-count{background:var(--gold);color:#fff;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:700;}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--navy-dark);color:#fff;padding:10px 18px;border-radius:30px;font-size:13px;z-index:50;opacity:0;pointer-events:none;transition:opacity .25s, bottom .25s;}
  .toast.show{opacity:1;bottom:100px;}
  .flex-between{display:flex;justify-content:space-between;align-items:center;}
  .small-input{width:70px;text-align:center;}
  a.link{color:var(--teal);}
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ---------------- storage helpers ---------------- */
let STORAGE_OK = null; // null=unknown, true/false once tested
async function checkStorage(){
  if(!(window.storage && window.storage.get && window.storage.set)){ STORAGE_OK=false; return false; }
  try{
    const probe = await window.storage.set('__probe__', JSON.stringify({t:Date.now()}), true);
    STORAGE_OK = !!probe;
  }catch(e){ STORAGE_OK=false; }
  return STORAGE_OK;
}
async function sGet(key){
  try{
    if(!(window.storage && window.storage.get)) throw new Error('no window.storage');
    const r = await window.storage.get(key, true); return r ? JSON.parse(r.value) : null;
  }catch(e){ return null; }
}
async function sSet(key, value){
  try{
    if(!(window.storage && window.storage.set)) throw new Error('no window.storage');
    const r = await window.storage.set(key, JSON.stringify(value), true); return !!r;
  }catch(e){ console.error('storage set failed', key, e); return false; }
}
async function sList(prefix){
  try{
    if(!(window.storage && window.storage.list)) throw new Error('no window.storage');
    const r = await window.storage.list(prefix, true); return r ? r.keys : [];
  }catch(e){ return []; }
}
function storageBanner(){
  if(STORAGE_OK!==false) return '';
  return `<div class="card" style="background:#FBEAE8;border-color:#F1B6AE;">
    <strong style="color:var(--red);">⚠️ 目前無法連線到共用資料庫</strong>
    <p class="muted" style="margin:6px 0 0;">請確認你是透過 Claude 提供的「分享連結／預覽」開啟本頁面，而不是下載檔案後直接用瀏覽器開啟。若已透過分享連結開啟仍看到此訊息，請重新整理頁面再試一次。</p>
  </div>`;
}

/* ---------------- constants ---------------- */
const GAMES = [
  { key:'basketball', label:'投籃挑戰', emoji:'🏀' },
  { key:'pot',        label:'投壺挑戰', emoji:'🏺' },
  { key:'pingpong',   label:'乒乓杯子', emoji:'🏓' },
];
const DEFAULT_INVENTORY = [
  {id:'i1', name:'棒球日野球魂摺疊小扇子', qty:23},
  {id:'i2', name:'台達藍色鴨舌帽', qty:42},
  {id:'i3', name:'龍舟賽頭巾', qty:6},
  {id:'i4', name:'2026移工禮品香包', qty:39},
  {id:'i5', name:'原民小旅行-斜背包', qty:50},
  {id:'i6', name:'2024樂活日野餐墊', qty:40},
  {id:'i7', name:'齊柏林Delta水壺', qty:53},
  {id:'i8', name:'禮券', qty:80},
  {id:'i9', name:'小新皮革鑰匙圈', qty:178},
  {id:'i10', name:'三麗鷗提袋', qty:202},
];
const STAFF_PIN = '9190'; // 工作人員後台密碼，可自行修改

/* ---------------- global state ---------------- */
let state = {
  role: null,       // 'front' | 'back'
  empId: null, empName: null,
  frontTab: 'race',
  backAuthed: false,
  backTab: 'stamp',
  stampGame: 'basketball',
};

function parseHash(){
  const h = new URLSearchParams(location.hash.slice(1));
  if(h.get('role')) state.role = h.get('role');
  if(h.get('id')) state.empId = h.get('id');
  if(h.get('name')) state.empName = decodeURIComponent(h.get('name'));
  if(h.get('ft')) state.frontTab = h.get('ft');
}
function writeHash(){
  const p = new URLSearchParams();
  if(state.role) p.set('role', state.role);
  if(state.empId) p.set('id', state.empId);
  if(state.empName) p.set('name', encodeURIComponent(state.empName));
  if(state.frontTab) p.set('ft', state.frontTab);
  history.replaceState(null,'','#'+p.toString());
}

function toast(msg){
  let t = document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.id='toast'; t.className='toast'; document.body.appendChild(t); }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2000);
}

function genCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s=''; for(let i=0;i<6;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}

/* ---------------- root render ---------------- */
const root = document.getElementById('root');
async function render(){
  parseHash();
  if(STORAGE_OK===null) await checkStorage();
  if(!state.role){ renderRoleGate(); return; }
  if(state.role==='front'){ renderFront(); return; }
  if(state.role==='back'){ renderBack(); return; }
}

/* ================= ROLE GATE ================= */
function renderRoleGate(){
  root.innerHTML = `
  <div class="gate">
    ${STORAGE_OK===false ? `<div style="width:100%;max-width:340px;">${storageBanner()}</div>` : ''}
    <div class="icon">🐉🚣</div>
    <h2 style="color:var(--navy);margin:0 0 4px;">龍舟賽周邊集章遊戲</h2>
    <p class="muted" style="margin:0 0 26px;">9/19 現場活動 ‧ 線上電子章</p>
    <div style="width:100%;max-width:320px;display:flex;flex-direction:column;gap:12px;">
      <button class="btn-primary" id="goFront">👤 我是同事，開始玩</button>
      <button class="btn-outline" id="goBack">🛠 我是工作人員，進入後台</button>
    </div>
  </div>`;
  document.getElementById('goFront').onclick=()=>{ state.role='front'; writeHash(); render(); };
  document.getElementById('goBack').onclick=()=>{ state.role='back'; writeHash(); render(); };
}

/* ================= FRONT (employee) ================= */
async function renderFront(){
  if(!state.empId){ renderFrontLogin(); return; }
  root.innerHTML = `
  <div class="app">
    <header class="topbar">
      <span class="role-switch" id="switchRole">切換身分</span>
      <h1>🐉 龍舟賽周邊活動</h1>
      <p>${state.empName} ‧ 工號 ${state.empId}</p>
    </header>
    <div class="screen" id="frontScreen"></div>
    <div class="tabbar">
      <button data-t="race"><span class="ic">📡</span>賽況</button>
      <button data-t="stamp"><span class="ic">🎯</span>集章</button>
      <button data-t="prize"><span class="ic">🎁</span>兌獎</button>
      <button data-t="game"><span class="ic">🚣</span>小遊戲</button>
    </div>
  </div>`;
  document.getElementById('switchRole').onclick=()=>{ state.role=null; state.empId=null; state.empName=null; location.hash=''; render(); };
  [...document.querySelectorAll('.tabbar button')].forEach(b=>{
    b.classList.toggle('active', b.dataset.t===state.frontTab);
    b.onclick=()=>{ state.frontTab=b.dataset.t; writeHash(); render(); };
  });
  const el = document.getElementById('frontScreen');
  if(state.frontTab==='race') await renderFrontRace(el);
  else if(state.frontTab==='stamp') await renderFrontStamp(el);
  else if(state.frontTab==='prize') await renderFrontPrize(el);
  else if(state.frontTab==='game') await renderFrontGame(el);
}

function renderFrontLogin(){
  root.innerHTML = `
  <div class="gate">
    <div style="width:100%;max-width:320px;">${storageBanner()}</div>
    <div class="icon">🎟️</div>
    <h2 style="color:var(--navy);margin:0 0 4px;">輸入你的資料</h2>
    <p class="muted" style="margin:0 0 24px;">用來記錄集章進度，離開頁面後憑工號可繼續</p>
    <div style="width:100%;max-width:320px;">
      <label>姓名</label>
      <input type="text" id="inName" placeholder="王小明">
      <label>工號 / 暱稱（作為識別碼）</label>
      <input type="text" id="inId" placeholder="A12345">
      <button class="btn-primary" style="margin-top:18px;" id="enterBtn">進入活動頁面</button>
      <p class="muted" id="loginError" style="margin-top:10px;color:var(--red);"></p>
      <p class="muted" style="margin-top:4px;cursor:pointer;text-decoration:underline;" id="backHome">← 返回</p>
    </div>
  </div>`;
  document.getElementById('enterBtn').onclick=async ()=>{
    const name = document.getElementById('inName').value.trim();
    const id = document.getElementById('inId').value.trim();
    const errEl = document.getElementById('loginError');
    errEl.textContent='';
    if(!name || !id){ toast('請填寫姓名與工號'); return; }
    const btn = document.getElementById('enterBtn');
    btn.disabled = true; btn.textContent = '處理中...';
    const key = 'employees:'+id;
    let emp = await sGet(key);
    if(!emp){
      emp = { id, name, stamps:{basketball:false,pot:false,pingpong:false}, coupon:null, redeemed:false, prize:null };
      const ok = await sSet(key, emp);
      if(!ok){
        btn.disabled=false; btn.textContent='進入活動頁面';
        errEl.textContent = '⚠️ 無法儲存資料，請確認網路連線，或改用 Claude 分享連結開啟本頁面後再試一次。';
        await checkStorage();
        renderFrontLogin();
        return;
      }
      // verify write actually persisted
      const verify = await sGet(key);
      if(!verify){
        btn.disabled=false; btn.textContent='進入活動頁面';
        errEl.textContent = '⚠️ 資料寫入後讀取失敗，請重新整理頁面再試一次。';
        return;
      }
      emp = verify;
    }
    state.empId = id; state.empName = emp.name;
    writeHash(); render();
  };
  document.getElementById('backHome').onclick=()=>{ state.role=null; render(); };
}

async function renderFrontRace(el){
  el.innerHTML = `<div class="card"><p class="muted">載入賽況中...</p></div>`;
  const rs = await sGet('race_status') || { title:'龍舟賽即時戰況', text:'工作人員尚未更新今日賽況，請稍後再查看，或現場關注司儀廣播。', youtube:'' };
  el.innerHTML = `
    <div class="card">
      <h3>📡 ${rs.title}</h3>
      <p style="font-size:13.5px;line-height:1.6;">${rs.text.replace(/\n/g,'<br>')}</p>
      ${rs.youtube ? `<div style="margin-top:10px;border-radius:10px;overflow:hidden;aspect-ratio:16/9;"><iframe width="100%" height="100%" src="${rs.youtube}" frameborder="0" allowfullscreen></iframe></div>` : ''}
      <p class="muted" style="margin-top:10px;">最後更新：${rs.updatedAt ? new Date(rs.updatedAt).toLocaleString('zh-TW') : '尚未更新'}</p>
    </div>
    <div class="card">
      <h3>⏱ 今日流程</h3>
      <p class="muted" style="line-height:1.8;">09:30–16:30　周邊遊戲區開放<br>11:00–13:00　午餐時段（關主輪替）<br>集滿 3 枚電子章即可兌換禮品券</p>
    </div>`;
}

async function renderFrontStamp(el){
  el.innerHTML = `<div class="card"><p class="muted">載入中...</p></div>`;
  const emp = await sGet('employees:'+state.empId);
  if(!emp){
    el.innerHTML = `${storageBanner()}
      <div class="card" style="text-align:center;">
        <p class="muted">找不到你的資料，可能是雲端連線暫時中斷。</p>
        <button class="btn-outline" id="retryStamp" style="margin-top:8px;">🔄 重新整理</button>
        <button class="btn-ghost" id="relogin" style="margin-top:8px;">重新輸入姓名工號</button>
      </div>`;
    document.getElementById('retryStamp').onclick=()=>renderFrontStamp(el);
    document.getElementById('relogin').onclick=()=>{ state.empId=null; state.empName=null; writeHash(); render(); };
    return;
  }
  const doneCount = GAMES.filter(g=>emp.stamps[g.key]).length;
  el.innerHTML = `
    ${storageBanner()}
    <div class="card">
      <h3>🎯 集章進度</h3>
      <div class="progress-track"><div class="progress-fill" style="width:${doneCount/3*100}%;"></div></div>
      <p class="muted">${doneCount} / 3 完成</p>
      <div class="stamp-row">
        ${GAMES.map(g=>`
          <div class="stamp ${emp.stamps[g.key]?'done':''}">
            <span class="emoji">${g.emoji}</span>
            <div class="label">${g.label}</div>
            <div class="state">${emp.stamps[g.key] ? '已蓋章 ✓' : '請至關卡蓋章'}</div>
          </div>`).join('')}
      </div>
      <p class="muted" style="margin-top:6px;">請至對應遊戲關卡完成挑戰，由工作人員協助蓋上電子章。</p>
    </div>
    ${doneCount===3 ? renderCouponBlock(emp) : ''}
  `;
  if(doneCount===3 && !emp.coupon){
    const code = genCode();
    emp.coupon = code;
    await sSet('employees:'+state.empId, emp);
    render();
  }
}

function renderCouponBlock(emp){
  if(emp.redeemed){
    return `<div class="prize-card"><div class="muted" style="color:#FBD9D4;">已兌換禮品</div><div class="name">${emp.prize||''}</div></div>`;
  }
  return `<div class="coupon">
    <div class="muted" style="color:#BFD3E3;">恭喜集滿三章！兌換序號</div>
    <div class="code">${emp.coupon||''}</div>
    <div class="muted" style="color:#BFD3E3;">請至禮品區出示此序號，由工作人員協助抽獎</div>
  </div>`;
}

async function renderFrontPrize(el){
  el.innerHTML = `<div class="card"><p class="muted">載入中...</p></div>`;
  const emp = await sGet('employees:'+state.empId);
  if(!emp){
    el.innerHTML = `${storageBanner()}<div class="card" style="text-align:center;"><p class="muted">找不到你的資料，請重新整理頁面。</p><button class="btn-outline" id="retryPrize">🔄 重新整理</button></div>`;
    document.getElementById('retryPrize').onclick=()=>renderFrontPrize(el);
    return;
  }
  const doneCount = GAMES.filter(g=>emp.stamps[g.key]).length;
  if(emp.redeemed){
    el.innerHTML = `<div class="prize-card">
      <div class="muted" style="color:#FBD9D4;">🎉 你已兌換禮品</div>
      <div class="name">${emp.prize}</div>
    </div>
    <div class="card"><p class="muted">感謝參與，手部應蓋有西瓜章，仍可自由體驗各項遊戲喔！</p></div>`;
  } else if(doneCount===3){
    el.innerHTML = `${renderCouponBlock(emp)}
    <div class="card"><h3>如何兌換？</h3><p class="muted" style="line-height:1.8;">1. 前往禮品區<br>2. 出示上方序號給工作人員<br>3. 工作人員協助抽籤並登記領取<br>4. 手部蓋西瓜章，完成兌換</p></div>`;
  } else {
    el.innerHTML = `<div class="card" style="text-align:center;">
      <div style="font-size:34px;">🔒</div>
      <h3>尚未集滿三章</h3>
      <p class="muted">目前進度 ${doneCount} / 3，完成所有關卡後即可產生兌換序號。</p>
    </div>`;
  }
}

/* ---- mini game: 划龍舟拚手速 ---- */
let gameTimer=null, gameActive=false, tapCount=0, gameEndAt=0;
async function renderFrontGame(el){
  const board = (await sGet('leaderboard')) || [];
  el.innerHTML = `
    <div class="card">
      <h3>🚣 划龍舟拚手速</h3>
      <p class="muted">10 秒內盡量點擊「划槳」，看看能不能划贏對手船！沒有比賽也能消耗時間 😄</p>
      <canvas id="raceCanvas" height="140"></canvas>
      <div class="flex-between" style="margin-top:10px;">
        <span class="muted" id="timeLabel">尚未開始</span>
        <span class="muted" id="tapLabel">划槳次數：0</span>
      </div>
      <button class="btn-primary" id="tapBtn" style="margin-top:12px;">🛶 開始比賽</button>
    </div>
    <div class="card">
      <h3>🏆 排行榜 Top 10</h3>
      ${board.length ? board.slice(0,10).map((r,i)=>`
        <div class="row-item"><span>${i+1}. ${r.name}</span><span class="badge-count">${r.taps} 槳</span></div>
      `).join('') : `<div class="empty">還沒有人挑戰，當第一名吧！</div>`}
    </div>`;

  const canvas = document.getElementById('raceCanvas');
  const ctx = canvas.getContext('2d');
  function resize(){ canvas.width = canvas.clientWidth; drawFrame(0,0); }
  window.addEventListener('resize', resize);
  const FINISH = ()=>canvas.width-40;
  const BOT_SPEED = ()=> (canvas.width-70)/10000; // px per ms

  function drawFrame(playerX, botX){
    const w=canvas.width, h=canvas.height;
    ctx.clearRect(0,0,w,h);
    // lanes
    ctx.strokeStyle='rgba(255,255,255,.6)'; ctx.setLineDash([6,6]);
    ctx.beginPath(); ctx.moveTo(0,h*0.38); ctx.lineTo(w,h*0.38); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,h*0.78); ctx.lineTo(w,h*0.78); ctx.stroke();
    ctx.setLineDash([]);
    // finish line
    ctx.fillStyle='#fff'; ctx.fillRect(w-36,10,4,h-20);
    ctx.font='20px sans-serif'; ctx.fillText('🏁', w-34, 30);
    // boats
    ctx.font='30px sans-serif';
    ctx.fillText('🚣', Math.min(playerX,w-40), h*0.38+8);
    ctx.font='26px sans-serif';
    ctx.fillText('🐉', Math.min(botX,w-40), h*0.78+6);
    ctx.font='11px sans-serif'; ctx.fillStyle='rgba(15,61,92,.7)';
    ctx.fillText('你', 6, h*0.38-6);
    ctx.fillText('對手', 6, h*0.78-6);
  }
  resize();

  let startTime=0, rafId=null;
  function loop(){
    const now = performance.now();
    const elapsed = now - startTime;
    const botX = 20 + BOT_SPEED()*Math.min(elapsed,10000);
    const playerX = 20 + tapCount*7;
    drawFrame(playerX, botX);
    const remain = Math.max(0, 10 - elapsed/1000);
    document.getElementById('timeLabel').textContent = gameActive ? `剩餘 ${remain.toFixed(1)} 秒` : '比賽結束';
    document.getElementById('tapLabel').textContent = `划槳次數：${tapCount}`;
    if(elapsed < 10000 && gameActive){ rafId = requestAnimationFrame(loop); }
    else if(gameActive){ endGame(playerX, botX); }
  }
  async function endGame(playerX, botX){
    gameActive=false;
    const btn=document.getElementById('tapBtn');
    btn.textContent='🔄 再玩一次';
    const win = playerX >= botX;
    toast(win ? `🎉 你贏了對手船！划槳 ${tapCount} 次` : `💦 差一點！划槳 ${tapCount} 次`);
    let board = (await sGet('leaderboard')) || [];
    board.push({ name: state.empName, taps: tapCount, at: Date.now() });
    board = board.sort((a,b)=>b.taps-a.taps).slice(0,10);
    await sSet('leaderboard', board);
    renderFrontGame(el);
  }
  document.getElementById('tapBtn').onclick=()=>{
    if(!gameActive){
      gameActive=true; tapCount=0; startTime=performance.now();
      document.getElementById('tapBtn').textContent='🛶 用力點擊划槳！';
      loop();
    } else {
      tapCount++;
    }
  };
}

/* ================= BACK (staff) ================= */
function renderBack(){
  if(!state.backAuthed){ renderBackGate(); return; }
  root.innerHTML = `
  <div class="app">
    <header class="topbar">
      <span class="role-switch" id="switchRole">離開後台</span>
      <h1>🛠 工作人員後台</h1>
      <p>龍舟賽周邊活動管理</p>
    </header>
    <div class="screen" id="backScreen"></div>
    <div class="tabbar">
      <button data-t="stamp"><span class="ic">🎯</span>蓋章站</button>
      <button data-t="redeem"><span class="ic">🎁</span>兌獎站</button>
      <button data-t="inv"><span class="ic">📦</span>庫存</button>
      <button data-t="race"><span class="ic">📡</span>賽況</button>
      <button data-t="dash"><span class="ic">📊</span>儀表板</button>
    </div>
  </div>`;
  document.getElementById('switchRole').onclick=()=>{ state.role=null; state.backAuthed=false; location.hash=''; render(); };
  [...document.querySelectorAll('.tabbar button')].forEach(b=>{
    b.classList.toggle('active', b.dataset.t===state.backTab);
    b.onclick=()=>{ state.backTab=b.dataset.t; render(); };
  });
  const el = document.getElementById('backScreen');
  if(state.backTab==='stamp') renderBackStamp(el);
  else if(state.backTab==='redeem') renderBackRedeem(el);
  else if(state.backTab==='inv') renderBackInventory(el);
  else if(state.backTab==='race') renderBackRace(el);
  else if(state.backTab==='dash') renderBackDash(el);
}

function renderBackGate(){
  root.innerHTML = `
  <div class="gate">
    <div class="icon">🔐</div>
    <h2 style="color:var(--navy);margin:0 0 4px;">工作人員登入</h2>
    <p class="muted" style="margin:0 0 24px;">請輸入現場公告的通行密碼</p>
    <div style="width:100%;max-width:280px;">
      <input type="text" id="pinInput" placeholder="密碼" inputmode="numeric">
      <button class="btn-primary" style="margin-top:14px;" id="pinBtn">登入後台</button>
      <p class="muted" style="margin-top:14px;cursor:pointer;text-decoration:underline;" id="backHome">← 返回</p>
    </div>
  </div>`;
  document.getElementById('pinBtn').onclick=()=>{
    if(document.getElementById('pinInput').value.trim()===STAFF_PIN){ state.backAuthed=true; render(); }
    else toast('密碼錯誤');
  };
  document.getElementById('backHome').onclick=()=>{ state.role=null; render(); };
}

function renderBackStamp(el){
  el.innerHTML = `
    ${storageBanner()}
    <div class="card">
      <h3>🎯 蓋章站</h3>
      <label>選擇關卡</label>
      <div class="segmented" id="gameSeg">
        ${GAMES.map(g=>`<button data-g="${g.key}" class="${g.key===state.stampGame?'active':''}">${g.emoji} ${g.label}</button>`).join('')}
      </div>
      <label>員工工號</label>
      <input type="text" id="stampId" placeholder="輸入工號後按 Enter 或搜尋">
      <button class="btn-outline" style="margin-top:10px;width:100%;" id="searchBtn">搜尋員工</button>
      <div id="stampResult" style="margin-top:14px;"></div>
    </div>`;
  [...document.querySelectorAll('#gameSeg button')].forEach(b=>{
    b.onclick=()=>{ state.stampGame=b.dataset.g; renderBackStamp(el); };
  });
  const doSearch = async ()=>{
    const id = document.getElementById('stampId').value.trim();
    if(!id) return;
    const emp = await sGet('employees:'+id);
    const box = document.getElementById('stampResult');
    if(!emp){ box.innerHTML = `<p class="muted">查無此工號，請確認同事已在前台輸入資料建立紀錄。</p>`; return; }
    const g = GAMES.find(x=>x.key===state.stampGame);
    const already = emp.stamps[g.key];
    box.innerHTML = `
      <div class="card" style="background:var(--cream);">
        <div class="flex-between"><strong>${emp.name}</strong><span class="muted">工號 ${emp.id}</span></div>
        <p class="muted">${g.emoji} ${g.label}：${already ? '<span class="pill ok">已蓋章</span>' : '<span class="pill wait">尚未蓋章</span>'}</p>
        <button class="btn-primary" id="stampConfirm" ${already?'disabled':''}>${already?'已完成蓋章':'✅ 確認蓋章'}</button>
      </div>`;
    const btn = document.getElementById('stampConfirm');
    if(btn && !already){
      btn.onclick=async ()=>{
        emp.stamps[g.key]=true;
        await sSet('employees:'+emp.id, emp);
        toast(`已為 ${emp.name} 蓋上 ${g.label} 章`);
        doSearch();
      };
    }
  };
  document.getElementById('searchBtn').onclick=doSearch;
  document.getElementById('stampId').addEventListener('keydown',e=>{ if(e.key==='Enter') doSearch(); });
}

function renderBackRedeem(el){
  el.innerHTML = `
    ${storageBanner()}
    <div class="card">
      <h3>🎁 兌獎站</h3>
      <label>輸入員工工號</label>
      <input type="text" id="redeemId" placeholder="工號">
      <button class="btn-outline" style="margin-top:10px;width:100%;" id="redeemSearch">查詢</button>
      <div id="redeemResult" style="margin-top:14px;"></div>
    </div>`;
  const search = async ()=>{
    const id = document.getElementById('redeemId').value.trim();
    if(!id) return;
    const emp = await sGet('employees:'+id);
    const box = document.getElementById('redeemResult');
    if(!emp){ box.innerHTML=`<p class="muted">查無此工號</p>`; return; }
    const doneCount = GAMES.filter(g=>emp.stamps[g.key]).length;
    if(emp.redeemed){
      box.innerHTML = `<div class="prize-card"><div class="muted" style="color:#FBD9D4;">已於 ${new Date(emp.redeemedAt).toLocaleString('zh-TW')} 領取</div><div class="name">${emp.prize}</div></div>`;
      return;
    }
    if(doneCount<3){
      box.innerHTML = `<p class="muted">${emp.name} 目前完成 ${doneCount}/3 關卡，尚未取得抽獎資格。</p>`;
      return;
    }
    box.innerHTML = `
      <div class="card" style="background:var(--cream);">
        <div class="flex-between"><strong>${emp.name}</strong><span class="pill ok">3/3 已集章</span></div>
        <p class="muted">兌換序號：<strong>${emp.coupon}</strong></p>
        <button class="btn-primary" id="drawBtn">🎲 現場抽獎並登記領取</button>
      </div>`;
    document.getElementById('drawBtn').onclick=async ()=>{
      const inv = (await sGet('inventory')) || DEFAULT_INVENTORY;
      const pool = inv.filter(i=>i.qty>0);
      if(!pool.length){ toast('禮品已全部送完'); return; }
      let r = Math.random()*pool.reduce((s,i)=>s+i.qty,0);
      let picked = pool[pool.length-1];
      for(const item of pool){ if(r<item.qty){ picked=item; break; } r-=item.qty; }
      picked.qty -= 1;
      await sSet('inventory', inv);
      emp.redeemed=true; emp.prize=picked.name; emp.redeemedAt=Date.now();
      await sSet('employees:'+emp.id, emp);
      toast(`🎉 ${emp.name} 抽中「${picked.name}」`);
      search();
    };
  };
  document.getElementById('redeemSearch').onclick=search;
  document.getElementById('redeemId').addEventListener('keydown',e=>{ if(e.key==='Enter') search(); });
}

async function renderBackInventory(el){
  el.innerHTML = `<div class="card"><p class="muted">載入中...</p></div>`;
  let inv = await sGet('inventory');
  if(!inv){ inv = DEFAULT_INVENTORY.slice(); await sSet('inventory', inv); }
  el.innerHTML = `
    <div class="card">
      <h3>📦 禮品庫存管理</h3>
      <table>
        <thead><tr><th>品項</th><th>剩餘</th><th></th></tr></thead>
        <tbody>
        ${inv.map((item,idx)=>`
          <tr>
            <td>${item.name}</td>
            <td><input class="small-input" type="number" min="0" data-idx="${idx}" value="${item.qty}"></td>
            <td><button class="btn-ghost saveRow" data-idx="${idx}" style="padding:6px 10px;font-size:12px;">儲存</button></td>
          </tr>`).join('')}
        </tbody>
      </table>
      <p class="muted" style="margin-top:8px;">總計剩餘：${inv.reduce((s,i)=>s+i.qty,0)} 件</p>
    </div>
    <div class="card">
      <h3>➕ 新增品項</h3>
      <label>品項名稱</label>
      <input type="text" id="newName" placeholder="例如：加碼小禮">
      <label>數量</label>
      <input type="number" id="newQty" min="0" value="0">
      <button class="btn-primary" style="margin-top:10px;" id="addItem">新增</button>
    </div>`;
  [...document.querySelectorAll('.saveRow')].forEach(btn=>{
    btn.onclick=async ()=>{
      const idx = +btn.dataset.idx;
      const input = document.querySelector(`input[data-idx="${idx}"]`);
      inv[idx].qty = Math.max(0, parseInt(input.value)||0);
      await sSet('inventory', inv);
      toast('已儲存');
      renderBackInventory(el);
    };
  });
  document.getElementById('addItem').onclick=async ()=>{
    const name = document.getElementById('newName').value.trim();
    const qty = Math.max(0, parseInt(document.getElementById('newQty').value)||0);
    if(!name){ toast('請輸入品項名稱'); return; }
    inv.push({ id:'i'+Date.now(), name, qty });
    await sSet('inventory', inv);
    renderBackInventory(el);
  };
}

  el.innerHTML = `

    };

}

async function renderBackDash(el){
  el.innerHTML = `<div class="card"><p class="muted">統計中，請稍候...</p></div>`;
  const keys = await sList('employees:');
  let total=0, done3=0, redeemed=0;
  const perGame = { basketball:0, pot:0, pingpong:0 };
  for(const k of keys){
    const emp = await sGet(k);
    if(!emp) continue;
    total++;
    GAMES.forEach(g=>{ if(emp.stamps[g.key]) perGame[g.key]++; });
    if(GAMES.every(g=>emp.stamps[g.key])) done3++;
    if(emp.redeemed) redeemed++;
  }
  const inv = (await sGet('inventory')) || DEFAULT_INVENTORY;
  const invLeft = inv.reduce((s,i)=>s+i.qty,0);
  const invTotal = DEFAULT_INVENTORY.reduce((s,i)=>s+i.qty,0);
  el.innerHTML = `
    <div class="card">
      <h3>📊 活動儀表板</h3>
      <div class="row-item"><span>參與人數（已建立紀錄）</span><span class="badge-count">${total}</span></div>
      <div class="row-item"><span>集滿三章人數</span><span class="badge-count">${done3}</span></div>
      <div class="row-item"><span>已完成兌獎</span><span class="badge-count">${redeemed}</span></div>
    </div>
    <div class="card">
      <h3>各關卡蓋章數</h3>
      ${GAMES.map(g=>`<div class="row-item"><span>${g.emoji} ${g.label}</span><span class="badge-count">${perGame[g.key]}</span></div>`).join('')}
    </div>
    <div class="card">
      <h3>禮品庫存</h3>
      <div class="progress-track"><div class="progress-fill" style="width:${invTotal? (invLeft/invTotal*100):0}%;background:var(--teal);"></div></div>
      <p class="muted">剩餘 ${invLeft} / 原始 ${invTotal} 件</p>
    </div>
    <button class="btn-outline" style="width:100%;" id="refreshDash">🔄 重新整理統計</button>`;
  document.getElementById('refreshDash').onclick=()=>renderBackDash(el);
}

render();
</script>
